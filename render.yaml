services:
  - type: web
    name: resume-ai-platform
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./resume_ai.db
      - key: EMBEDDING_BACKEND
        value: tfidf
