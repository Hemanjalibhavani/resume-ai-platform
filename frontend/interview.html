<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Preparation · ResumeAI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<main id="page"><div class="page-head"><div><h1>Interview Preparation</h1><p class="muted">Questions personalised from your resume, job description and skill gaps.</p></div></div>
 <div class="card-x"><h4>Categories <span class="muted small">(none selected = balanced mix)</span></h4><div id="cats"></div>
  <div class="grid g3" style="margin-top:.6rem"><div><label class="small muted">Number of questions</label><input type="number" id="count" value="12" min="1" max="40"></div>
   <div style="align-self:end"><label><input type="checkbox" id="answers"> Include sample answers</label></div></div>
  <div style="margin-top:1rem"><button class="btn-grad" id="gen"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate questions</button> <button class="btn-soft hidden" id="start"><i class="fa-solid fa-play"></i> Start practice interview</button></div></div>
 <div id="practice" class="hidden"></div><div id="list"></div></main>
<script src="js/app.js"></script>
<script src="js/interview.js"></script>
</body></html>
