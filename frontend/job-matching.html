<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Matching · ResumeAI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<main id="page"><div class="page-head"><div><h1>Job Matching</h1><p class="muted">Paste or upload a job description to see an explainable match score.</p></div></div>
 <div class="card-x"><div class="grid g2"><div><label class="small muted">Paste job description</label><textarea id="jd" rows="9" placeholder="Paste the job description here..."></textarea></div>
  <div><label class="small muted">...or upload a file (PDF, DOCX, TXT)</label><input type="file" id="jdfile" accept=".pdf,.docx,.txt" style="margin-bottom:1rem">
   <label class="small muted">...or pick a sample job</label><select id="sample"><option value="">— choose sample —</option></select></div></div>
  <div style="margin-top:1rem"><button class="btn-grad" id="analyze-btn"><i class="fa-solid fa-bolt"></i> Analyze Match</button> <button class="btn-soft" id="rank-btn"><i class="fa-solid fa-ranking-star"></i> Rank all sample jobs</button></div></div>
 <div id="rank"></div><div id="result"></div></main>
<script src="js/app.js"></script>
<script src="js/matching.js"></script>
</body></html>
