services:
  app:
    build:
      context: .
      args:
        INSTALL_AI: "false"
    ports:
      - "8000:8000"
    env_file:
      - .env.example   # copy to .env and add keys if you want LLM mode
    environment:
      DATABASE_URL: sqlite:////data/resume_ai.db
      VECTOR_DB_PATH: /data/vector_store
      UPLOAD_DIR: /data/uploads
    volumes:
      - appdata:/data
volumes:
  appdata:
